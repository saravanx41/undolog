[project]
name = "undolog-adapters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "undolog-core",
    "stripe>=10.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undolog_adapters"]
