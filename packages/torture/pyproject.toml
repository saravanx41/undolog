[project]
name = "undolog-torture"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "undolog-core",
    "undolog-adapters",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undolog_torture"]
