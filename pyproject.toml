[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undolog"
version = "0.1.0"
description = "Append-only ledger, taxonomy, and rollback engine for agent side effects"
requires-python = ">=3.12"
dependencies = [
    "undolog-core",
    "undolog-adapters",
    "undolog-torture",
]

[project.scripts]
undolog = "undolog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["undolog"]

# Local resolution for the workspace packages. uv reads these when
# installing this project (`uv pip install -e .`); plain pip users should
# install packages/* individually or use `pip install -e packages/core` etc.
[tool.uv.sources]
undolog-core = { path = "packages/core", editable = true }
undolog-adapters = { path = "packages/adapters", editable = true }
undolog-torture = { path = "packages/torture", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
markers = [
    "ts04_partial: TS-04 out-of-process HTTP variant pending a real sandbox key (issue #1)",
]
